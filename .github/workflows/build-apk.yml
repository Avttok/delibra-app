name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk "saida/Delibra-motoboy-build${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Delibra-motoboy-build${{ github.run_number }}
          path: saida/*.apk

      # Cria uma "Release" com o APK anexado: fácil de baixar direto no celular.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Delibra · build ${{ github.run_number }}"
          prerelease: true
          files: saida/*.apk
          body_path: NOTAS_DA_VERSAO.md

      # Arquivo que o atualizador do app lê (download comum, sem o limite de 60 consultas/h da API).
      - name: Publicar versao.json
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="saida/Delibra-motoboy-build${GITHUB_RUN_NUMBER}.apk"
          python3 - "$APK" <<'PY'
          import json, os, sys
          apk = sys.argv[1]
          run = int(os.environ["GITHUB_RUN_NUMBER"]); repo = os.environ["GITHUB_REPOSITORY"]
          from datetime import datetime, timezone
          json.dump({
            "build": run,
            "nome": f"Delibra · build {run}",
            "notas": open("NOTAS_DA_VERSAO.md", encoding="utf-8").read().strip(),
            "url": f"https://github.com/{repo}/releases/download/build-{run}/{os.path.basename(apk)}",
            "tamanho": os.path.getsize(apk),
            "publicada_em": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }, open("versao.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          gh release view atualizacao >/dev/null 2>&1 || gh release create atualizacao --prerelease --title "Atualizador do app (não apagar)" --notes "Guarda o versao.json que o app consulta para saber se há versão nova."
          gh release upload atualizacao versao.json --clobber
