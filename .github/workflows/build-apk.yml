name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Chave de assinatura (secrets do repositório). Sem ela o build segue com a chave de desenvolvimento.
      - name: Preparar assinatura digital
        env:
          KS_B64: ${{ secrets.DELIBRA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/delibra-release.jks"
            echo "DELIBRA_KEYSTORE=$RUNNER_TEMP/delibra-release.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave de produção da Delibra."
          else
            echo "::warning::Secret DELIBRA_KEYSTORE_B64 ausente: APK assinado com a chave de desenvolvimento."
          fi

      - name: Compilar APK assinado
        env:
          DELIBRA_KEYSTORE_SENHA: ${{ secrets.DELIBRA_KEYSTORE_SENHA }}
          DELIBRA_KEY_ALIAS: ${{ secrets.DELIBRA_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Conferir assinatura e renomear APK
        run: |
          mkdir -p saida
          APK=app/build/outputs/apk/release/app-release.apk
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          cp "$APK" "saida/Delibra-motoboy-build${GITHUB_RUN_NUMBER}.apk"
          rm -f "$RUNNER_TEMP/delibra-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Delibra-motoboy-build${{ github.run_number }}
          path: saida/*.apk

      # Cria uma "Release" com o APK anexado: fácil de baixar direto no celular.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Delibra · build ${{ github.run_number }}"
          prerelease: true
          files: saida/*.apk
          body_path: NOTAS_DA_VERSAO.md

      # Arquivo que o atualizador do app lê (download comum, sem o limite de 60 consultas/h da API).
      - name: Publicar versao.json
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="saida/Delibra-motoboy-build${GITHUB_RUN_NUMBER}.apk"
          python3 - "$APK" <<'PY'
          import json, os, sys
          apk = sys.argv[1]
          run = int(os.environ["GITHUB_RUN_NUMBER"]); repo = os.environ["GITHUB_REPOSITORY"]
          from datetime import datetime, timezone
          json.dump({
            "build": run,
            "nome": f"Delibra · build {run}",
            "notas": open("NOTAS_DA_VERSAO.md", encoding="utf-8").read().strip(),
            "url": f"https://github.com/{repo}/releases/download/build-{run}/{os.path.basename(apk)}",
            "tamanho": os.path.getsize(apk),
            "publicada_em": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }, open("versao.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          gh release view atualizacao >/dev/null 2>&1 || gh release create atualizacao --prerelease --title "Atualizador do app (não apagar)" --notes "Guarda o versao.json que o app consulta para saber se há versão nova."
          gh release upload atualizacao versao.json --clobber
